[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler"
version = "0.1.0"
description = "Multi-platform social media crawler with LLM-powered topic extraction"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loguru>=0.7.0",
    "langchain-openai>=0.3.0",
    "openai>=1.0.0",
    "pymysql>=1.1.0",
    "fastapi>=0.110.2,<1.0.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
